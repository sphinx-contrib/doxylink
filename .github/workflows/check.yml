name: Check

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_call: {}

permissions:
  contents: read

jobs:
  code-checks:
    name: Tests and lints
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Install doxygen
        run: |
          sudo apt install -y doxygen
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: pip install poetry
      - name: Setup package
        run: poetry install
      - name: Run mypy
        run: poetry run mypy --install-types --non-interactive sphinxcontrib/doxylink
      - name: Run pytest
        run: poetry run pytest
      - name: Test that package builds
        run: poetry build

  build-docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tox and Poetry
        run: pip install tox poetry
      - name: Build docs
        run: tox -e doc

  build-examples:
    name: Build examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install doxygen
        run: |
          sudo apt install -y doxygen
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tox and Poetry
        run: pip install tox poetry
      - name: Build examples
        run: tox -e examples
